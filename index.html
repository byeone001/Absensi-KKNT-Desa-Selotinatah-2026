<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Presensi KKN-T Selotinatah</title>
    <!-- Tailwind CSS (CDN for zero-cost and quick setup) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Custom styles to refine Tailwind and create premium look */
        body {
            background-color: #f3f4f6;
            /* Tailwind gray-100 */
            font-family: 'Inter', sans-serif;
        }

        #reader {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            border-radius: 1rem;
            overflow: hidden;
            border: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            background: white;
        }

        #reader video {
            border-radius: 1rem;
            object-fit: cover;
        }

        /* Hide html5-qrcode extra borders */
        #reader img {
            display: none !important;
        }

        #reader__dashboard_section_csr span {
            color: #ef4444 !important;
            font-weight: 600;
        }

        #reader__dashboard_section_swaplink {
            color: #3b82f6 !important;
            text-decoration: underline;
        }

        button {
            background-color: #3b82f6 !important;
            color: white !important;
            padding: 0.5rem 1rem !important;
            border-radius: 0.5rem !important;
            font-weight: 500 !important;
            border: none !important;
            transition: background-color 0.2s !important;
        }

        button:hover {
            background-color: #2563eb !important;
        }
    </style>
</head>

<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl p-6 sm:p-8 space-y-6">
        <div class="text-center space-y-2">
            <h1 class="text-2xl font-extrabold text-gray-800 tracking-tight">Presensi KKN-T</h1>
            <p class="text-sm font-medium text-gray-500">Scan QR Code untuk Kegiatan & Evaluasi</p>
        </div>

        <!-- Notification Box -->
        <div id="notification" class="hidden rounded-xl p-4 mb-4 text-sm font-semibold transition-all duration-300">
        </div>

        <!-- Scanner Viewport -->
        <div class="relative">
            <div id="reader"></div>
            <!-- Loading Overlay -->
            <div id="loading"
                class="hidden absolute inset-0 bg-white/80 backdrop-blur-sm flex flex-col items-center justify-center rounded-2xl z-10 transition-opacity duration-300">
                <svg class="animate-spin h-10 w-10 text-blue-600 mb-3" xmlns="http://www.w3.org/2000/svg" fill="none"
                    viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor"
                        d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                    </path>
                </svg>
                <p class="text-blue-700 font-bold animate-pulse">Memproses presensi...</p>
            </div>
        </div>

        <div class="text-center">
            <p class="text-xs text-gray-400 font-medium mt-4">&copy; 2026 Tim KKN-T Selotinatah</p>
        </div>
    </div>

    <!-- html5-qrcode Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script>
        // --- CONFIGURATION ---
        // GANTI URL DI BAWAH INI DENGAN URL DEPLOYMENT GOOGLE APPS SCRIPT KAMU
        const SCRIPT_URL = 'https://script.google.com/a/macros/mhs.unesa.ac.id/s/AKfycbzQD7_JJmg2OyABSvMhUTHO5qwclH9OX3xjWZPU2RLmDbbZqxOJuPApt9J-o4C0plUghQ/exec';
        // ---------------------

        const html5QrCode = new Html5Qrcode("reader");
        const notification = document.getElementById('notification');
        const loadingOverlay = document.getElementById('loading');
        let isProcessing = false;

        function showNotification(message, type) {
            notification.className = `rounded-xl p-4 mb-4 text-sm font-semibold transition-all duration-300 transform scale-100 shadow-sm`;

            if (type === 'success') {
                notification.classList.add('bg-green-100', 'text-green-800', 'border', 'border-green-200');
            } else if (type === 'warning') {
                notification.classList.add('bg-yellow-100', 'text-yellow-800', 'border', 'border-yellow-200');
            } else if (type === 'error') {
                notification.classList.add('bg-red-100', 'text-red-800', 'border', 'border-red-200');
            }

            notification.innerText = message;
            notification.classList.remove('hidden');
        }

        function hideNotification() {
            notification.classList.add('hidden');
            notification.className = 'hidden';
        }

        async function handleScan(decodedText) {
            if (isProcessing) return; // Mencegah scan ganda saat masih loading

            isProcessing = true;

            // 1. Bekukan scanner & tampilkan loading
            html5QrCode.pause();
            hideNotification();
            loadingOverlay.classList.remove('hidden');

            try {
                // 3. Kirim HTTP POST ke Google Apps Script
                const response = await fetch(SCRIPT_URL, {
                    method: 'POST',
                    headers: {
                        // Menggunakan text/plain untuk menghindari isu CORS preflight (OPTIONS) dari GAS
                        'Content-Type': 'text/plain',
                    },
                    body: JSON.stringify({ member_code: decodedText })
                });

                const data = await response.json();

                // 4. Tampilkan hasil di notifikasi
                if (data.status === 200) {
                    showNotification(data.message, 'success');
                } else if (data.status === 429) {
                    showNotification(data.message, 'warning');
                } else {
                    showNotification(data.message, 'error');
                }

            } catch (error) {
                console.error("Error sending data:", error);
                showNotification("Gagal terhubung ke server. Periksa koneksi internet.", 'error');
            } finally {
                // Hilangkan efek loading
                loadingOverlay.classList.add('hidden');

                // 5. Tunggu 3 detik, bersihkan alert, dan lanjutkan scan kamera
                setTimeout(() => {
                    hideNotification();
                    isProcessing = false;
                    html5QrCode.resume();
                }, 3000);
            }
        }

        // Auto-start webcam config
        const config = { fps: 10, qrbox: { width: 250, height: 250 } };

        // Start scanner menggunakan kamera belakang (environment)
        html5QrCode.start({ facingMode: "environment" }, config, handleScan)
            .catch(err => {
                console.error("Camera startup error:", err);
                showNotification("Gagal mengakses kamera. Pastikan izin kamera diberikan pada browser.", 'error');
            });
    </script>
</body>

</html>
